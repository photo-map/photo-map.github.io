name: Build & deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # 允许在 Actions 页面手动触发（也可 gh workflow run），
  # 用于按需验证流水线本身，例如 2026-11-19 后确认 Ubuntu 26.04 迁移无影响
  workflow_dispatch:

# 同一分支的连续触发排队执行而不是并发，避免两次部署互相覆盖 gh-pages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 默认最小权限；只有 deploy job 需要写权限
permissions:
  contents: read

env:
  REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
  REACT_APP_AMAP_API_KEY: ${{ secrets.REACT_APP_AMAP_API_KEY }}
  REACT_APP_BAIDU_MAP_AK: ${{ secrets.REACT_APP_BAIDU_MAP_AK }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install NPM packages
        run: npm ci

      # CRA 的 react-scripts build 内嵌类型检查与 lint，vite build 不做，必须在 CI 显式补回
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: production-files
          path: ./dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
